<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Early Flutter FCM bridge stub:
       Flutter WebView calls window.onFlutterFCMToken(token) as soon as it has the native
       FCM token, which may happen BEFORE the React bundle loads. This stub queues those
       calls so they are not lost. React's setupFlutterFCMBridge() will flush the queue. -->
  <script>
    window.__flutterFcmTokenQueue = [];
    window.onFlutterFCMToken = function(token) {
      if (token) window.__flutterFcmTokenQueue.push(token);
    };
  </script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Wasgro Mart-Fast Grocery Delivery</title>

  <!-- Preload critical assets for route changes -->
  <link rel="preload" href="/animations/loading.json" as="fetch" crossorigin="anonymous" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
