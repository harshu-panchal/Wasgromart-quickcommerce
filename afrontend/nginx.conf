server {
    listen 80;
    listen [::]:80;
    server_name wasgromart.com www.wasgromart.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wasgromart.com www.wasgromart.com;

    # SSL certificate paths — update these to your actual cert paths
    ssl_certificate /etc/letsencrypt/live/wasgromart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wasgromart.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory where Vite build output (dist/) is served from
    root /var/www/wasgromart/dist;
    index index.html;

    # Serve static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Firebase service worker — must be served without cache
    location /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Proxy API calls to the backend (avoids CORS in production)
    location /api/v1/ {
        proxy_pass https://api.wasgromart.com/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host api.wasgromart.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
    }

    # ============================================================
    # THE CRITICAL FIX:
    # For ALL other routes (including /seller/*, /admin/*, /delivery/*),
    # serve index.html so React Router can handle the navigation.
    # Without this, the server returns 404 for direct URL access.
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
